id = "carhacks"
name = "Car Hacks"
version = "0.2.5"
# the JERICHO interface (SDK) this mod is built against
interface = 3
author = "JERICHO"
description = "Vehicle-availability and cross-city vehicle hacks for Driver 2: unlock the extra vehicles in the frontend car list, and import vehicles that belong to another city's data. Standalone (lifted out of Caine's Crossfire) so it can be enabled next to the multiplayer module."
# core multiplayer suite: mandatory, first in the load order (jer_manager.c)
dependencies = []
# host API generation this module expects (see jer_host_api.h)
host_api = 1
# ON out of the box: this is the module the release exists to provide, and a release
# no longer ships a modlist.ini, so this value IS the shipped default.
default-enabled = true
